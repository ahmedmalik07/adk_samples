apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lodgio-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        autoscaling.knative.dev/minScale: '0'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/memory: '2Gi'
        run.googleapis.com/cpu: '1000m'
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/lodgio-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: PYTHONPATH
              value: '/app'
            - name: FLASK_ENV
              value: 'production'
          resources:
            limits:
              cpu: '1000m'
              memory: '2Gi'
            requests:
              cpu: '500m'
              memory: '1Gi'
